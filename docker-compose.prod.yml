# Production Compose overlay for running QueueIt containers with managed backing services.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d backend frontend nginx
# Keep .env.production out of Git and provide real values through your deployment platform or secret manager.
services:
  backend:
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to a managed MongoDB connection string}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to a managed or secured Redis endpoint}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET to a strong random secret}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the public application origin}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:?Set SOCKET_CORS_ORIGIN to the public application origin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
    depends_on: !reset []

  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:?Set VITE_SOCKET_URL to the public application origin}

  nginx:
    ports:
      - "${NGINX_PORT:-80}:80"

  mongodb:
    profiles:
      - local-dependencies

  redis:
    profiles:
      - local-dependencies
