name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, build, and verify Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate production Compose configuration
        env:
          JWT_SECRET: ci-production-compose-jwt-secret
          REFRESH_TOKEN_SECRET: ci-production-compose-refresh-secret
          CORS_ORIGIN: https://queueit.example.com
          SOCKET_CORS_ORIGIN: https://queueit.example.com
          VITE_SOCKET_URL: https://queueit.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Build Docker images
        run: docker compose build backend frontend
