  requestBodies:
    GenericResource:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericResourceInput" }
    Bulk:
      required: true
      content:
        application/json:
          schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/GenericResourceInput" }, maxItems: 100 } }, required: [items] }
  responses:
    Success:
      description: Successful response
      content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
    ListSuccess:
      description: Successful list response
      content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } }
    Error:
      description: Error response
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    GenericResourceInput:
      type: object
      additionalProperties: true
      properties:
        name: { type: string, maxLength: 160 }
        status: { type: string }
        metadata: { type: object, additionalProperties: true }
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties: { success: { const: true }, data: true, meta: { type: object, additionalProperties: true } }
    ListEnvelope:
      type: object
      required: [success, data, meta]
      properties: { success: { const: true }, data: { type: array, items: true }, meta: { type: object, additionalProperties: true } }
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success: { const: false }
        error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, details: { type: array, items: { type: object, additionalProperties: true } } } }
        meta: { type: object, additionalProperties: true }
